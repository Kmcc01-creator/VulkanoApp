[text_settings]
default_font = "Arial"
font_size = 16.0
line_height = 1.2
letter_spacing = 0.0

[text_settings.sdf_settings]
smoothing = 0.25
thickness = 0.5
padding = 4.0

[theme.colors]
primary = [1.0, 1.0, 1.0, 1.0]
secondary = [0.7, 0.7, 0.7, 1.0]
highlight = [0.0, 0.8, 1.0, 1.0]

[[blocks]]
id = "title"
content = "Hello World"
position = [0.0, 0.0]
color = "primary"
scale = 2.0
selectable = true

[[blocks]]
id = "subtitle"
content = "Click to interact"
position = [0.0, 50.0]
color = "secondary"
scale = 1.0
selectable = true
