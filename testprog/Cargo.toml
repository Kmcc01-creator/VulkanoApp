[package]
name = "testprog"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "testprog"
path = "main.rs"

[dependencies]
vulkano = { version = "0.35.1", features = ["macros"] }
vulkano-shaders = "0.35.0"
vulkano-util = "0.35.0"
winit = { version = "0.30.9", features = ["x11", "wayland"] }
bytemuck = { version = "1.21.0", features = ["derive"] }
glam = "0.29.2"
memoffset = "0.9"
