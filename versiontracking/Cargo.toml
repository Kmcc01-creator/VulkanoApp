[package]
name = "versiontracking"
version = "0.1.0"
edition = "2021"

[dependencies]
cargo_metadata = "0.15"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
thiserror = "1.0"
dirs = "5.0"
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing"] }
quote = "1.0"
proc-macro2 = "1.0"
toml = "0.7"
anyhow = "1.0"
rayon = "1.7"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.3"
owo-colors = "3.5"
dialoguer = "0.10"
tar = "0.4"
flate2 = "1.0"
indexmap = "1.9"

[lib]
name = "versiontracking"
path = "src/lib.rs"

[[bin]]
name = "versiontracking"
path = "src/bin/versiontracking.rs"
