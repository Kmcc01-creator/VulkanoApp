# Version Tracking Tools Configuration

[general]
# Script files to include
include = ["**/*.script"]
# Script files to exclude
exclude = ["**/test/**", "**/examples/**"]
# Path to custom patterns directory
patterns_dir = "scripts/patterns"
# Path to custom templates directory
templates_dir = "scripts/templates"
# Enable debug output
debug = false

[analysis]
# Enable safety checks
check_safety = true
# Enable pattern detection
detect_patterns = true
# Enable async code analysis
async_aware = true
# Enable strict mode
strict = false
# Custom analysis patterns
custom_patterns = [
    "resource_management",
    "thread_safety",
    "blocking_io"
]

[generation]
# Generate documentation
documentation = true
# Code optimization level (none, default, size, speed)
optimization = "default"
# Add safety checks
safety_checks = true
# Default visibility
default_visibility = "pub"
# Custom transforms to apply
custom_transforms = [
    "async_wrapper",
    "error_handling"
]

[patterns]
# Default options for all patterns
[patterns.defaults]
visibility = "pub"
async = "false"
documentation = "true"
error_handling = "true"

# Pattern-specific overrides
[patterns.overrides.builder]
enabled = true
[patterns.overrides.builder.options]
validation = "true"
doc = "true"

[patterns.overrides.resource_guard]
enabled = true
[patterns.overrides.resource_guard.options]
cleanup = "true"
error_handling = "true"

[patterns.overrides.async_wrapper]
enabled = true
[patterns.overrides.async_wrapper.options]
error_handling = "true"
tokio = "true"

[patterns.overrides.state_machine]
enabled = true
[patterns.overrides.state_machine.options]
async = "true"
transitions = "true"
visualization = "true"

[patterns.overrides.rest_client]
enabled = true
[patterns.overrides.rest_client.options]
async = "true"
error_handling = "true"
retry = "true"

[patterns.overrides.metrics]
enabled = true
[patterns.overrides.metrics.options]
prometheus = "true"
labels = ["endpoint", "status"]

[patterns.overrides.thread_safe]
enabled = true
[patterns.overrides.thread_safe.options]
sync = "RwLock"
metrics = "true"

# Example of a custom pattern configuration
[patterns.overrides.custom_pattern]
enabled = true
[patterns.overrides.custom_pattern.options]
option1 = "value1"
option2 = "value2"

# Path-specific configurations
[paths]
"src/core/" = { strict = true, safety_checks = true }
"src/api/" = { async = true, documentation = true }
"src/utils/" = { optimization = "speed" }

# Template configurations
[templates]
# Default template options
[templates.defaults]
visibility = "pub"
documentation = true

# Template-specific overrides
[templates.overrides.struct]
[templates.overrides.struct.options]
derive = ["Debug", "Clone"]
builder = true

[templates.overrides.trait]
[templates.overrides.trait.options]
async_trait = true
error_handling = true

# Output configurations
[output]
# Generated code formatting
format = true
# Add file headers
add_headers = true
# Header template
header_template = """
// Generated by Version Tracking Tools
// Do not edit manually
"""

# Development configurations
[development]
# Enable development features
dev_mode = false
# Enable verbose logging
verbose = false
# Enable profiling
profiling = false