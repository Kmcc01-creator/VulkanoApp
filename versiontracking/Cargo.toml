[package]
name = "versiontracking"
version = "0.1.0"
edition = "2021"

[dependencies]
cargo_metadata = "0.14"
clap = { version = "4.0", features = ["derive"] }
dialoguer = "0.9"
owo-colors = "1.2"
reqwest = { version = "0.11", features = ["json"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
walkdir = "2.3"
syn = { version = "1.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
rayon = "1.7"
similar = "2.2"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.17"
toml = "0.7"
indexmap = "2.0"
tar = "0.4"
flate2 = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.0"
dirs = "5.0"
futures = "0.3"
