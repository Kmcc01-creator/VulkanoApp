[package]
name = "testprog"
version = "0.1.0"
edition = "2021"

[dependencies]
vulkano = { version = "0.34", features = ["macros"] }
vulkano-shaders = "0.34"
winit = "0.28"
glam = { version = "0.24", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.14", features = ["derive", "extern_crate_std"] }
smallvec = "1.11"
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.8"
notify = "6.1"
libloading = "0.8"

[build-dependencies]
shaderc = "0.8"
